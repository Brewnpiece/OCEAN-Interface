<!DOCTYPE html>
<html>

<!-- HEAD -->
<head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OCEAN Interface</title>
  <link href="style.css" rel="stylesheet" type="text/css"/>
</head>

<!-- BODY -->
<body style="background-color: #D6B588;" style="background-image: url('background.svg'); background-repeat: no-repeat; background-size: cover; background-attachment: fixed;">
  
  <!-- FORM -->
  <form name="submit-to-google-sheet">

  <div id="pages">

    <!-- ID PAGE -->
    <div id="ID" style="display: block">

      <h1 style="margin-top: 10vh; margin-bottom: 5vh;">OCEAN V2.0 2026</h1>

      <br>

      <table class="container2">

        <tr>
          <td><h3>Scouter Initials</h3></td>
          <td><input class="ID" name="Name" type="text" id="scouter-name"></td>
        </tr>

        <tr>
          <td><h3>Match #</h3></td>
          <td><input class="ID" name="Match" type="text" id="match-number" inputmode="numeric"></td>
        </tr>

        <tr>
          <td><h3>Robot Side</h3></td>
          <td> <select class="ID" name="Side" id="robot-side">
              <option disabled hidden selected>SELECT</option>
              <option class="Red">Red 1</option>
              <option class="Red">Red 2</option>
              <option class="Red">Red 3</option>
              <option class="Blue">Blue 1</option>
              <option class="Blue">Blue 2</option>
              <option class="Blue">Blue 3</option>
            </select></td>
        </tr>

        <tr><td><h3>Team #</h3> </td>
          <td><input class="ID" name="Team-Number" type="text" id="team-number" inputmode="numeric"></td>
        </tr>

      </table>

      <div class="container2">
        <button class="updater" type="Button"onclick="swipePage(1)" style="width: 75vw;">Next</button>
      </div>
    </div>

    <!-- AUTON -->
    <div id="Auton" style="display: none;"> 

      <h1>Auton</h1>

      <br>

      <h3>Auton Fuel</h3>
      <div class="fuel-split" id="Fuel_Auton">
        <input class="fuel-counter" type="text" value="0"/>
        <div class="row-wrapper">
        <button class="fuel-button" type="Button" value="1">+1</button>
        <button class="fuel-button" type="Button" value="5">+5</button>
        <button class="fuel-button" type="Button" value="10">+10</button>
        <button class="fuel-button" type="Button" value="Undo">Undo</button>
        </div>
      </div>

      <div class="row-wrapper">
        <button class="selector toggle" type="button" value="0">Human</button>
        <button class="selector toggle" type="Button" value="0">Center</button >
      </div>
      
      <div class="row-wrapper">
        <button class="selector accuracy" type="Button" onclick="swipePage(1)">Accuracy</button>
        </div>
    
      <div class="row-wrapper">
          <button  class="selector climb" type="Button" onclick="swipePage(2)">Climb</button>
      </div>

      <div class="container2">
        <button class="updater" onclick="swipePage(-1)" type="Button">Prev</button>
        <button class="updater" onclick="swipePage(3)" type="Button">Next</button>
      </div>
    </div>

    <!-- ACCURACY AUTON -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-1)">100-90%</button>
      <button type="button" class="four" onclick="swipePage(-1)">89%-70%</button>
      <button type="button" class="four" onclick="swipePage(-1)">70%-49%</button>
      <button type="button" class="four" onclick="swipePage(-1)">< 50%</button>
    </div>

    <!-- CLIMB AUTON -->
    <div class="climb-two" style="display: none;">
       <button class="two" type="button" onclick="swipePage(-2)">L2</button>
      <button class="two" type="button" onclick="swipePage(-2)">L1</button>
    </div>

    <!-- TELEOP -->
    <div id="Teleop" style="display: none;">

      <h1>Teleop</h1>

      <br>
      
    <h3>Teleop Fuel</h3>
     <div class="fuel-split" id="Fuel_Teleop">
      <input class="fuel-counter" type="text" value="0"/>
        <div class="row-wrapper">
         <button class="fuel-button" type="Button" value="1">+1</button>
         <button class="fuel-button" type="Button" value="5">+5</button>
         <button class="fuel-button" type="Button" value="10">+10</button>
         <button class="fuel-button" type="Button" value="Undo">Undo</button>
       </div>
      </div>

      <div class="row-wrapper">
        <button class="selector accuracy" type="Button" onclick="swipePage(1)">Accuracy</button>
        </div>    

      <div class="container2">
        <button class="updater" onclick="swipePage(-3)" type="Button">Prev</button>
        <button class="updater" onclick="swipePage(3)" type="Button">Next</button>
      </div>
    </div>

    <!-- ACCURACY TELEOP -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-1)">100-90%</button>
      <button type="button" class="four" onclick="swipePage(-1)">89%-70%</button>
      <button type="button" class="four" onclick="swipePage(-1)">70%-49%</button>
      <button type="button" class="four" onclick="swipePage(-1)">< 50%</button>
    </div>
  
    <!-- ALGAE PAGE TELEOP (OLD) -->
    <div id="Algea Split_T" style="display: none;">
      <button id="two" data-group="DeAlgae_T" type="button" class="update" title="L3" onclick="swipePage(-2)">L3</button>
      <button id="two" data-group="DeAlgae_T" type="button" class="update" title="L2" onclick="swipePage(-2)">L2</button>
    </div>
  
    <!-- ENDGAME -->
    <div id="Endgame" style="display: none;">
      <h1>Endgame</h1>
      <br>
      <h3>Final Status</h3>
      <table class="container2">
        <tr>
          <td>Parked</td>
          <td><input name="Parked" id ="parked" type="checkbox" class="checkboxes" onclick="onlyOne(this)"></td>
        </tr>
        <td>Shallow</td>
        <td><input name="Shallow" id="shallow" type="checkbox" class="checkboxes" onclick="onlyOne(this)"></td>
        </tr>
        <td>Deep</td>
        <td><input name="Deep" id="deep" type="checkbox" class="checkboxes" onclick="onlyOne(this)"></td>
        </tr>
        <td>Failed Climb</td>
        <td><input name="Failed" id="failed" type="checkbox" class="checkboxes" onclick="onlyOne(this)"></td>
      </table>
      <h3>Comments</h3>
      <div class="container2">
        <textarea name="Comments" id="comments" rows="4" cols="50"></textarea>
      </div>
      <div class="container2">
        <button class="updater" onclick="swipePage(-3)" type="Button">Prev</button>
        <button class="updater" onclick="swipePage(1)" type="Button">Next</button>
      </div>
    </div>

    <!-- DATA -->
    <div id="Data" style="display: none;">
      <h1>Data</h1>

      <div class="container2">
        <button type="submit" onclick="myFunction();swipePage(1)">Submit</button>
      </div>
      <p id="output"></p>
      <div class="container2">
        <button class="updater" onclick="swipePage(-1)" type="Button">Prev</button>
      </div>
           
    </div>

   <!-- EXIT -->
    <div id="DataSent" class="imageContainer" style="text-align: center; vertical-align: middle; line-height: 600px; display: none;">Data Sent!</div>
  </div>

  <script src="script.js"></script>
  </form>
  
</body>

</html>
