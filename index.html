<!DOCTYPE html>
<html>

<!-- HEAD -->
<head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OCEAN Interface</title>
  <link href="style.css" rel="stylesheet" type="text/css"/>
</head>

<!-- BODY -->
<body style="background-color: #D6B588;" style="background-image: url('background.svg'); background-repeat: no-repeat; background-size: cover; background-attachment: fixed;">
  
  <!-- FORM -->
  <form name="submit-to-google-sheet">
    
  <!-- PAGES -->
  <div id="pages">

    <!-- ID PAGE -->
    <div id="ID" style="display: block">

      <h1 style="margin-top: 10vh; margin-bottom: 5vh;">OCEAN V2.0 2026</h1>

      <br>

      <table class="container2">

        <tr>
          <td><h3>Scouter Initials</h3></td>
          <td><input class="ID" name="Name" type="text" id="scouter-name"></td>
        </tr>

        <tr>
          <td><h3>Match #</h3></td>
          <td><input class="ID" name="Match" type="text" id="match-number" inputmode="numeric"></td>
        </tr>

        <tr>
          <td><h3>Robot Side</h3></td>
          <td> <select class="ID" name="Side" id="robot-side">
              <option disabled hidden selected>SELECT</option>
              <option class="Red">Red 1</option>
              <option class="Red">Red 2</option>
              <option class="Red">Red 3</option>
              <option class="Blue">Blue 1</option>
              <option class="Blue">Blue 2</option>
              <option class="Blue">Blue 3</option>
            </select></td>
        </tr>

        <tr><td><h3>Team #</h3> </td>
          <td><input class="ID" name="Team-Number" type="text" id="team-number" inputmode="numeric"></td>
        </tr>

      </table>

      <div class="container2">
        <button class="updater" type="Button"onclick="swipePage(1)" style="width: 75vw;">Next</button>
      </div>
    </div>

    <!-- AUTON -->
    <div id="Auton" style="display: none;"> 

      <h1>Auton</h1>

      <br>

      <h3>Auton Fuel</h3>
      <div class="fuel-split" id="Fuel_Auton">
        <input name="Auton-Fuel" class="fuel-counter" type="text" value="0"/>
        <div class="row-wrapper">
        <button class="fuel-button" type="Button" value="1">+1</button>
        <button class="fuel-button" type="Button" value="3">+3</button>
        <button class="fuel-button" type="Button" value="5">+5</button>
        <button class="fuel-button" type="Button" value="Undo">Undo</button>
        </div>
      </div>

      <div class="row-wrapper">
        <button data-name="Auton-Human" class="selector toggle" type="button" value="0">Human</button>
        <button data-name="Auton-Center" class="selector toggle" type="Button" value="0">Center</button >
      </div>
      
      <div class="row-wrapper">
        <button data-name="Auton-Accuracy" class="selector accuracy" type="Button" onclick="swipePage(1); buttonClick(this)">Accuracy</button>
        </div>
    
      <div class="row-wrapper">
          <button data-name="Auton-Climb" class="selector toggle" type="Button" value="0">Climb?</button>
      </div>

      <div class="container2">
        <button class="updater" onclick="swipePage(-1)" type="Button">Prev</button>
        <button class="updater" onclick="swipePage(2)" type="Button">Next</button>
      </div>
    </div>

    <!-- ACCURACY AUTON -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">100-90%</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">89%-70%</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">70%-49%</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">< 50% / NONE</button>
    </div>

    <!-- TELEOP -->
    <div id="Teleop" style="display: none;">

      <h1>Teleop</h1>

      <br>
      
    <h3>Teleop Fuel</h3>
     <div class="fuel-split" id="Fuel_Teleop">
      <input name="Teleop-Fuel" class="fuel-counter" type="text" value="0"/>
        <div class="row-wrapper">
         <button class="fuel-button" type="Button" value="1">+1</button>
         <button class="fuel-button" type="Button" value="3">+3</button>
         <button class="fuel-button" type="Button" value="5">+5</button>
         <button class="fuel-button" type="Button" value="Undo">Undo</button>
       </div>
      </div>

      <div class="row-wrapper">
        <button data-name="Teleop-Accuracy" class="selector accuracy" type="Button" onclick="swipePage(1); buttonClick(this)">Accuracy</button>
        </div>

      <div class="row-wrapper">
        <button data-name="Teleop-Broken" class="selector broken" type="Button" onclick="swipePage(2); buttonClick(this)">Broken</button>
        </div>

      <div class="row-wrapper">
        <button data-name="Teleop-Type" class="selector type" type="Button" onclick="swipePage(3); buttonClick(this)">Type</button>
        </div>

      <div class="container2">
        <button class="updater" onclick="swipePage(-3)" type="Button">Prev</button>
        <button class="updater" onclick="swipePage(4)" type="Button">Next</button>
      </div>
    </div>

    <!-- ACCURACY TELEOP -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">100-90%</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">89%-70%</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">70%-49%</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">< 50%</button>
    </div>
  
    <!-- BROKEN TELEOP -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)">Did Not Work</button>
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)">Mostly Broken/Stuck</button>
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)">Somewhat Broken/Stuck</button>
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)">Not Broken/Stuck</button>
    </div>

     <!-- TYPE TELEOP -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-3); setParent(this)">Scorer</button>
      <button type="button" class="four" onclick="swipePage(-3); setParent(this)">Shuttler</button>
      <button type="button" class="four" onclick="swipePage(-3); setParent(this)">Defence</button>
      <button type="button" class="four" onclick="swipePage(-3); setParent(this)">Mix</button>
    </div>
  
    <!-- ENDGAME -->
    <div id="Endgame" style="display: none;">

      <h1>Endgame</h1>

      <br>

      <div class="row-wrapper">
          <button data-name="Final-Climb" class="selector climb" type="Button" onclick="swipePage(1); buttonClick(this)">Final Climb Status</button>
      </div>
      
      <div class="row-wrapper">
          <button data-name="Defence" class="selector" type="Button" onclick="swipePage(2); buttonClick(this)">Defence?</button>
      </div>

      <h3>Comments</h3>

      <div class="container2">
        <textarea name="Comments" id="comments" rows="4" cols="60"></textarea>
      </div>

      <div class="container2">
        <button class="updater" onclick="swipePage(-4)" type="Button">Prev</button>
        <button class="updater" onclick="swipePage(3)" type="Button">Next</button>
      </div>

    </div>

    <!-- CLIMB ENDGAME -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">L3</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">L2</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">L1</button>
      <button type="button" class="four" onclick="swipePage(-1); setParent(this)">No Climb</button>
    </div>

    <!-- DEFENCE ENDGAME -->
    <div class="accuracy-four" style="display: none;">
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)" >Defence Bot</button>
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)">More Defence</button>
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)">Some Defence</button>
      <button type="button" class="four" onclick="swipePage(-2); setParent(this)">No Defence</button>
    </div>

    <!-- DATA -->
    <div id="Data" style="display: none;">
      <h1>Data</h1>

      <div class="container2">
        <button type="submit" onclick="swipePage(1)">Submit</button>
      </div>
      <p id="output"></p>
       <div class="container2">
        <button class="updater" type="Button"onclick="swipePage(-3)" style="width: 75vw;">Prev</button>
      </div>
           
    </div>

   <!-- EXIT -->
    <div id="DataSent" style="display: none;">
      <div id="status-icon" class="loading-circle"></div>
      <h1 id="status-text" style="margin-top: 20px;">Sending Data...</h1>
      <button id="retry-btn" class="row-wrapper" type="button" style="display:none" onclick="resetAfterError()">Try Again</button>
    </div>
  </div>

  <script src="script.js"></script>

  </form>
  
</body>

</html>
